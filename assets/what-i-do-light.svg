<title id="title">What I do: from raw data to decisions</title>
<desc id="desc">1. Collect &amp; engineer data: Web scraping, ETL pipelines, SQL &amp; Spark, Social-media data; 2. Model &amp; predict: Machine learning, Deep learning, Forecasting, Anomaly detection; 3. Optimize &amp; decide: LP / MIP models, Location–allocation, Scheduling, Pricing strategy; 4. Deliver &amp; automate: BI dashboards, Web apps &amp; APIs, Workflow automation, Docker &amp; cloud</desc>
